<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">LYRIS-BIBEL – FINAL Tief und warm</title><desc id="desc">Finale Freigabefassung: LYRIS-BIBEL. Anthrazit #282A2E links, Elfenbein #E9E2D5 rechts, Signet in der Gegenfarbe. Saitenbreite 10.9710520232 bei 1200 Einheiten Zeichenbreite. Buchstabe um 8 Prozent in der Breite reduziert; feine Buchstabenkonturen um 6 Einheiten und Lyra um 5 Einheiten verstaerkt. Bemaessung und Lyra in allen drei Marken identisch. Drei sichtbare Saiten; keine separate Sockellinie. RGB-Farben; deckende Hintergrundflaechen.</desc><defs><clipPath id="links"><rect width="600" height="1200"/></clipPath><clipPath id="rechts"><rect x="600" width="600" height="1200"/></clipPath></defs><rect width="1200" height="1200" fill="#E9E2D5"/><rect width="600" height="1200" fill="#282A2E"/><g clip-path="url(#rechts)"><path fill="#282A2E" fill-rule="nonzero" d="M599.9999999999 182.3833526013C662.334520232 182.3833526013 708.8020716778 173.76 764.3364624301 173.76C898.0723422007 173.76 975.1404763058 242.7468208102 975.1404763058 359.7780346847C975.1404763058 466.9539884434 926.4062150334 534.7089017391 849.3380809283 556.8832369995C951.3400231262 567.9704046297 1017.0746080983 649.2763005846 1017.0746080983 765.0756069446C1017.0746080983 925.2235838254 911.6726011604 1026.2400000118 779.0700763031 1026.2400000118C717.8689109843 1026.2400000118 655.5343907522 1023.7761849828 599.9999999999 1023.7761849828ZM649.8676161857 219.3405780353L649.8676161857 548.2598843982L755.2696231235 548.2598843982C861.8049849747 548.2598843982 924.1395052068 495.2878612761 924.1395052068 369.6332948004C924.1395052068 245.2106358391 847.0713711017 191.0067052025 724.6690404641 191.0067052025C672.5347144518 191.0067052025 649.8676161857 197.1662427749 649.8676161857 219.3405780353ZM649.8676161857 577.8256647455L649.8676161857 931.3831213977C649.8676161857 992.9784971211 685.0016184983 10